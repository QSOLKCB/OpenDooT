name: Validate and deploy OpenDooT
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opendoot-pages
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: python3 tests/smoke.py
      - name: JavaScript syntax
        run: |
          node --check site.js
          node --check music.js
          node --check game.js
          node tests/game-input.test.cjs
          node tests/music.test.cjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only the website
        run: |
          mkdir -p _site
          cp index.html styles.css site.js music.js game.js favicon.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
